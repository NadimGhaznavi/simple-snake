# BMFORGE_COMPONENT: bmforge.github-pages; spec_version: 0.1.0
remote_theme: "NadimGhaznavi/minimal-mistakes"
minimal_mistakes_skin: "dark"

title: "Simple Snake"
title_separator: "-"
name: "Simple Snake"
description: "A portable PySide6 Snake game with human play, CPU-based Q-learning, and embedded training charts."
locale: "en-US"
url: "https://simplesnake.osoyalce.com"
baseurl: ""
repository: "NadimGhaznavi/simple-snake"
logo: "/pages/images/simple-snake.png"

mycount:
  endpoint: "https://count.osoyalce.com/count"
  site: "simple-snake"
multilingual:
  enabled: true
  default_lang: en

author:
  name: "Nadim Ghaznavi"
  bio: "Creator"
  location: ""
  email: ""
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/NadimGhaznavi"
footer:
  since: "2026"

include:
  - pages
exclude:
  - AGENTS.md
  - simplesnake
  - loeber-snake
  - .agents
  - .codex
  - .venv
  - requirements.txt
  - THIRD_PARTY_NOTICES.md
  - README.md
  - LICENSE
  - scripts
  - tests
  - pyproject.toml
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6
sass:
  style: compressed
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      classes: wide
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: wide
      author_profile: true
      read_time: false
      share: true
      related: true
