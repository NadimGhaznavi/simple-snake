[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-snake"
version = "0.0.0"
description = "A small PySide6 Snake game with embedded AI training charts"
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = "GPL-3.0-or-later"
dependencies = [
    "PySide6>=6.8,<7",
    "numpy>=2,<3",
    "torch>=2.6,<3",
]

[project.gui-scripts]
simple-snake = "simplesnake.__main__:main"

[tool.setuptools.packages.find]
include = ["simplesnake*"]

[tool.setuptools.package-data]
simplesnake = ["locales/*.json", "assets/*.html", "assets/*.js", "assets/*LICENSE"]
